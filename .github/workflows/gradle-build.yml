# Workflow réutilisable : build + tests Gradle (Java 25).
# Les dépôts qui dépendent de l'API la clonent à côté d'eux (build composite).
name: Build Gradle

on:
  workflow_call:
    inputs:
      needs-api:
        description: "Cloner CubixMCDev/cubix-api à côté du dépôt"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@v5
        if: ${{ inputs.needs-api }}
        with:
          repository: CubixMCDev/cubix-api
          path: cubix-api
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build et tests
        working-directory: ${{ github.event.repository.name }}
        run: ./gradlew build --console=plain
